<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Search</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
  }

  header {
    background: white;
    padding: 15px 20px;
    border-bottom: 1px solid #ddd;
  }

  .search-box {
    display: flex;
    gap: 10px;
    max-width: 700px;
    margin: auto;
  }

  #search-input {
    flex: 1;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }

  #clear-btn {
    padding: 10px 14px;
    border: none;
    background: #e74c3c;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    display: none;
  }

  .suggestions-dropdown {
    max-width: 700px;
    margin: 5px auto 0;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    display: none;
  }

  .suggestions-dropdown.visible {
    display: block;
  }

  .suggestion-item {
    padding: 10px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
  }

  .suggestion-item:hover {
    background: #f2f2f2;
  }

  .main-layout {
    display: flex;
    min-height: calc(100vh - 70px);
  }

  .results-panel {
    flex: 1;
    padding: 20px;
  }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
  }

  .player-card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
  }

  .player-card:hover {
    border-color: #3498db;
  }

  .player-panel {
    width: 350px;
    background: white;
    border-left: 1px solid #ddd;
    padding: 20px;
  }

  .player-panel.hidden {
    display: none;
  }

  .loading,
  .empty {
    text-align: center;
    padding: 40px;
    color: #666;
  }

  .error {
    background: #ffe6e6;
    color: #c00;
    padding: 10px;
    border-radius: 8px;
  }

  button {
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="search-box">
    <input
      type="text"
      id="search-input"
      placeholder="Buscar jugadores..."
      autocomplete="off"
    >
    <button id="clear-btn">Limpiar</button>
  </div>

  <div id="suggestions" class="suggestions-dropdown"></div>
</header>

<div class="main-layout">
  <div class="results-panel" id="results-panel">
    <div class="empty">
      Escribe un nombre y presiona Enter
    </div>
  </div>

  <div class="player-panel hidden" id="player-panel">
    <button id="close-panel-btn">Cerrar</button>
    <div id="panel-content"></div>
  </div>
</div>

<script>
const REDIS_URL = 'http://localhost:8081';
const ES_URL = 'http://localhost:8083';
const INFO_URL = 'http://localhost:8082';

const searchInput = document.getElementById('search-input');
const clearBtn = document.getElementById('clear-btn');
const suggestionsEl = document.getElementById('suggestions');
const resultsPanel = document.getElementById('results-panel');
const playerPanel = document.getElementById('player-panel');
const panelContent = document.getElementById('panel-content');
const closePanelBtn = document.getElementById('close-panel-btn');

let debounceTimer = null;

function escapeHtml(text = '') {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function hideSuggestions() {
  suggestionsEl.innerHTML = '';
  suggestionsEl.classList.remove('visible');
}

async function fetchSuggestions(query) {
  try {
    const res = await fetch(
      `${REDIS_URL}/redis?key=${encodeURIComponent(query)}`
    );

    if (!res.ok) {
      hideSuggestions();
      return;
    }

    const players = await res.json();

    if (!Array.isArray(players) || players.length === 0) {
      hideSuggestions();
      return;
    }

    suggestionsEl.innerHTML = players.slice(0, 10).map(player => `
      <div
        class="suggestion-item"
        data-id="${player.id || ''}"
        data-name="${escapeHtml(player.name || '')}"
      >
        ${escapeHtml(player.name || '')}
      </div>
    `).join('');

    suggestionsEl.classList.add('visible');

    suggestionsEl.querySelectorAll('.suggestion-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = item.dataset.id;
        const name = item.dataset.name;

        searchInput.value = name;
        hideSuggestions();

        loadPlayerInfo(id);
      });
    });

  } catch (error) {
    console.error(error);
    hideSuggestions();
  }
}

async function runSearch(query) {
  resultsPanel.innerHTML = `
    <div class="loading">Buscando...</div>
  `;

  try {
    const res = await fetch(
      `${ES_URL}/search/players?q=${encodeURIComponent(query)}&page=1&size=50`
    );

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();

    renderResults(data.results || []);

  } catch (error) {
    resultsPanel.innerHTML = `
      <div class="error">
        Error cargando resultados: ${error.message}
      </div>
    `;
  }
}

function renderResults(players) {
  if (!players.length) {
    resultsPanel.innerHTML = `
      <div class="empty">No se encontraron resultados</div>
    `;
    return;
  }

  resultsPanel.innerHTML = `
    <div class="results-grid">
      ${players.map(player => {
        const id = player.player_id || '';
        const name = player.long_name || player.short_name || 'Sin nombre';
        const overall = player.overall ?? '-';
        const positions = player.player_positions || '-';
        const club = player.club_name || '-';

        return `
          <div class="player-card" data-id="${id}">
            <h3>${escapeHtml(name)}</h3>
            <p><strong>Overall:</strong> ${overall}</p>
            <p><strong>Posiciones:</strong> ${escapeHtml(positions)}</p>
            <p><strong>Club:</strong> ${escapeHtml(club)}</p>
          </div>
        `;
      }).join('')}
    </div>
  `;

  resultsPanel.querySelectorAll('.player-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;

      if (!id) {
        alert('No se encontró ID del jugador');
        return;
      }

      loadPlayerInfo(id);
    });
  });
}

async function loadPlayerInfo(playerId) {
  if (!playerId) {
    return;
  }

  playerPanel.classList.remove('hidden');

  panelContent.innerHTML = `
    <div class="loading">Cargando jugador...</div>
  `;

  try {
    const res = await fetch(
      `${INFO_URL}/player?name=${encodeURIComponent(playerId)}`
    );

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const player = await res.json();

    renderPlayer(player);

  } catch (error) {
    panelContent.innerHTML = `
      <div class="error">
        Error cargando jugador: ${error.message}
      </div>
    `;
  }
}

function renderPlayer(player) {
  const name = player.long_name || player.short_name || 'Sin nombre';

  panelContent.innerHTML = `
    <h2>${escapeHtml(name)}</h2>
    <p><strong>Overall:</strong> ${player.overall || '-'}</p>
    <p><strong>Posición:</strong> ${escapeHtml(player.player_positions || '-')}</p>
    <p><strong>Club:</strong> ${escapeHtml(player.club_name || '-')}</p>
    <p><strong>Nacionalidad:</strong> ${escapeHtml(player.nationality_name || '-')}</p>
    <p><strong>Edad:</strong> ${player.age || '-'}</p>
  `;
}

searchInput.addEventListener('input', () => {
  const value = searchInput.value.trim();

  clearBtn.style.display = value ? 'block' : 'none';

  clearTimeout(debounceTimer);

  if (value.length < 2) {
    hideSuggestions();
    return;
  }

  debounceTimer = setTimeout(() => {
    fetchSuggestions(value);
  }, 200);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const query = searchInput.value.trim();

    if (query) {
      hideSuggestions();
      runSearch(query);
    }
  }
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  hideSuggestions();

  resultsPanel.innerHTML = `
    <div class="empty">
      Escribe un nombre y presiona Enter
    </div>
  `;

  playerPanel.classList.add('hidden');
});

closePanelBtn.addEventListener('click', () => {
  playerPanel.classList.add('hidden');
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('header')) {
    hideSuggestions();
  }
});
</script>

</body>
</html>

<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Leaderboard</title>
  <link rel="stylesheet" href="./style2.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Leaderboard</h1>
      <p>Actualización automática cada 5 segundos</p>
    </header>

    <section class="panel">
      <div class="panel-header">
        <h2>Mi posición</h2>
        <button id="refreshBtn" class="btn">Actualizar ahora</button>
      </div>
      <div id="myRankCard" class="my-rank">
        <p>Cargando tu posición...</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Ranking global</h2>
        <span id="lastUpdated" class="muted">Última actualización: --</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Usuario</th>
              <th>Puntos</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <tr>
              <td colspan="3" class="empty">Cargando leaderboard...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./app2.js"></script>
</body>
</html>

version: '3.9'

# This docker-compose file sets up a complete learning environment for:
# - PostgreSQL: Powerful open-source relational database system

services:
  postgres:
    image: postgres:16-alpine
    container_name: db-lab-postgres
    ports:
    - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: labdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./import-data.sql:/docker-entrypoint-initdb.d/2-import-data.sql
      - ./players.csv:/docker-entrypoint-initdb.d/players.csv
    networks:
      - db-lab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 5

# Shared network for inter-service communication
networks:
  db-lab-net:
    driver: bridge

# Named volumes for data persistence
volumes:
  postgres-data:
    driver: local